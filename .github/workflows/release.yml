# Release workflow: on a v* tag, build Lumen with the hardened runtime, sign with Developer ID,
# notarise and staple, publish a GitHub Release with the zip + dmg, and push the updated Sparkle
# appcast to main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEVELOPER_ID_P12_BASE64   base64 of the Developer ID Application identity exported as a .p12
#                             (cert + private key). Produce with:
#                               security export -k login.keychain -t identities -f pkcs12 \
#                                 -P <p12-password> -o developer_id.p12
#                               base64 -i developer_id.p12 | pbcopy
#   DEVELOPER_ID_P12_PASSWORD password used when exporting the .p12 above.
#   KEYCHAIN_PASSWORD         any strong string; unlocks the throwaway CI keychain.
#   NOTARY_KEY_P8_BASE64      base64 of the App Store Connect API key (AuthKey_XXXXXXXXXX.p8):
#                               base64 -i AuthKey_XXXXXXXXXX.p8 | pbcopy
#   NOTARY_KEY_ID             the 10-char key ID of that API key (e.g. KMWT12AB34).
#   NOTARY_ISSUER_ID          the App Store Connect issuer UUID
#                             (cb2fff29-78dd-46b3-9519-4faff2a64499 for this account).
#   SPARKLE_ED_PRIVATE_KEY    the Sparkle EdDSA private key, as exported by
#                               ./vendor/Sparkle/bin/generate_keys -x private-key.txt
#                             (the file's full contents; it stays secret and is passed to
#                             generate_appcast with --ed-key-file in CI).
#
# Secrets are never echoed; they are written to files or piped into security/notarytool directly.
# The temporary keychain and all secret files are deleted in an always() cleanup step.

name: release

on:
  push:
    tags:
      - "v*"

# Least privilege: the job only needs to create a release and push the appcast commit.
permissions:
  contents: write

jobs:
  release:
    # macOS 27 with Xcode 27. The app targets macOS 27, and the macOS 14 runners were retired
    # from GitHub Actions on 2026-11-02.
    runs-on: xcode-27
    env:
      # Non-secret identifiers are safe to expose; issuer id comes from a secret anyway.
      LUMEN_SIGN_IDENTITY: "Developer ID Application: Raidel Almeida (MK26S2J3QC)"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so release.sh's build number (git commit count) is stable, and so the
          # appcast push can fast-forward main.
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Select Xcode command line tools
        run: xcode-select -p

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Vendor Sparkle
        run: ./scripts/dev/fetch-sparkle.sh

      - name: Create temporary keychain and import Developer ID
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          runner_tmp="${RUNNER_TEMP:-/tmp}"
          keychain="$runner_tmp/lumen-ci.keychain-db"
          p12="$runner_tmp/developer_id.p12"
          ed_key="$runner_tmp/sparkle_ed_private_key"

          # Decode the signing material from secrets to files (never printed).
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$p12"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$ed_key"

          # Throwaway keychain, unlocked, with a long timeout so it survives the whole build.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"

          # Import the Developer ID identity and let codesign use it without a UI prompt.
          security import "$p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null

          # Put the CI keychain first in the search list (keep the login keychain reachable).
          existing_keychains=()
          while IFS= read -r kc; do
            kc="${kc#\"}"; kc="${kc%\"}"
            [[ -n "$kc" ]] && existing_keychains+=("$kc")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          security default-keychain -s "$keychain"

          # Keep the Sparkle EdDSA key as a file and pass it to generate_appcast with
          # --ed-key-file. Importing it into the temporary keychain can make generate_appcast
          # wait for an approval prompt that no one can answer on a runner.
          echo "LUMEN_SPARKLE_KEY_FILE=$ed_key" >> "$GITHUB_ENV"

          # Sanity check: the Developer ID identity is now visible to codesign.
          security find-identity -v -p codesigning "$keychain"

      - name: Write notary API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          runner_tmp="${RUNNER_TEMP:-/tmp}"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$runner_tmp/notary_key.p8"

      - name: Build, sign, notarise, staple, appcast
        env:
          LUMEN_VERSION: ${{ steps.version.outputs.version }}
          LUMEN_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          runner_tmp="${RUNNER_TEMP:-/tmp}"
          # Pass notary credentials to release.sh as the explicit key triplet (no keychain profile
          # exists in CI). release.sh reads LUMEN_NOTARY_KEY / _KEY_ID / _ISSUER.
          export LUMEN_NOTARY_KEY="$runner_tmp/notary_key.p8"
          export LUMEN_NOTARY_KEY_ID="$NOTARY_KEY_ID"
          export LUMEN_NOTARY_ISSUER="$NOTARY_ISSUER_ID"
          ./scripts/release.sh

      - name: Create GitHub Release and upload artefacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          zip="dist/Lumen-${VERSION}.zip"
          dmg="dist/Lumen-${VERSION}.dmg"
          # Create the release if it does not exist yet, then upload (clobber to allow re-runs).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Lumen ${VERSION}" --generate-notes
          fi
          gh release upload "$TAG" "$zip" "$dmg" --clobber

      - name: Commit and push updated appcast
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml unchanged; nothing to push"
            exit 0
          fi
          # The tag build runs on a detached HEAD. Preserve the regenerated appcast, switch to
          # main, restore it there, then commit and push.
          cp appcast.xml "${RUNNER_TEMP:-/tmp}/appcast.xml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp "${RUNNER_TEMP:-/tmp}/appcast.xml" appcast.xml
          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml already current on main; nothing to push"
            exit 0
          fi
          git add appcast.xml
          git commit -m "Update appcast for ${TAG}"
          git push origin main

      - name: Clean up keychain and secret files
        if: always()
        run: |
          runner_tmp="${RUNNER_TEMP:-/tmp}"
          keychain="$runner_tmp/lumen-ci.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true
          # Restore the login keychain as default for good measure.
          security default-keychain -s login.keychain-db 2>/dev/null || true
          rm -f "$runner_tmp/developer_id.p12" "$runner_tmp/notary_key.p8" \
                "$runner_tmp/sparkle_ed_private_key" 2>/dev/null || true
