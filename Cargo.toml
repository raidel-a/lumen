[package]
name = "lumen"
version = "0.1.0"
edition = "2024"
description = "A menu bar display controller for macOS, starting with DDC/CI input switching"
license = "MIT"

[lib]
name = "lumen"
path = "src/lib.rs"

[[bin]]
name = "lumen-probe"
path = "src/bin/probe.rs"

[features]
# Off by default: builds the Sparkle self-update path (ObjC shim + vendored framework linkage).
# When off, the updater module compiles to logging no-ops, so `cargo test` / lumen-probe /
# non-bundle builds do not need the vendored framework. See scripts/dev/fetch-sparkle.sh.
default = []
sparkle = []

[build-dependencies]
cc = "1"

[dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.24"
libc = "0.2"
dispatch = "0.2"
block2 = "0.5"
objc2 = "0.5.3"
objc2-app-kit = { version = "0.2.2", features = ["all"] }
objc2-quartz-core = "0.2.2"
objc2-screen-capture-kit = { version = "0.2.2", features = ["SCStream", "SCShareableContent", "SCError", "SCScreenshotManager", "block2"] }
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSDate", "NSGeometry", "NSRunLoop", "NSString", "NSTimer", "NSValue"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
winit = "0.30.13"
